<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRnShort</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg1:#0f172a;--bg2:#6b21a8;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.15);--txt:#f1f5f9;--sub:#94a3b8;--accent:#c084fc;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--txt);min-height:100vh;padding:40px 16px}
  .wrap{max-width:620px;margin:0 auto}
  nav{display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
  nav a{color:var(--txt);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px}
  nav a.on{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700}
  h1{text-align:center;font-size:34px}
  .sub{text-align:center;color:var(--sub);margin:8px 0 28px;line-height:1.6}
  .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
  input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font-size:16px;outline:none}
  input:focus{border-color:var(--accent)}
  button{padding:14px;border:0;border-radius:12px;background:var(--accent);color:#0f172a;font-size:16px;font-weight:700;cursor:pointer}
  #go{width:100%;margin-top:12px}
  .msg{color:#fca5a5;font-size:14px;margin-top:10px;min-height:1em}
  #result{display:none;margin-top:20px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .panel{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
  .panel h3{font-size:14px;color:var(--accent);margin-bottom:12px}
  #qr{display:inline-block;padding:10px;background:#fff;border-radius:12px}
  #qr img,#qr canvas{display:block}
  #short{display:block;font-size:20px;font-weight:800;color:#fff;word-break:break-all;margin:18px 0 10px}
  .small{font-size:13px;color:var(--sub);word-break:break-all}
  .btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .btns button{padding:9px 14px;font-size:14px;background:transparent;border:1px solid var(--accent);color:var(--accent)}
  .link2qr{display:block;text-align:center;margin-top:24px;padding:14px;border-radius:14px;border:1px dashed var(--line);color:var(--txt);text-decoration:none}
  .link2qr:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="../">🏠 홈</a>
    <a href="../url2qr/">🔳 URL2QR</a>
    <a href="./" class="on">✂️ QRnShort</a>
  </nav>
  <h1>✂️ QRnShort</h1>
  <p class="sub">긴 URL을 입력하면 <b>단축 URL</b>과 <b>QR코드</b>를 한 번에 만들어 드립니다.</p>

  <div class="box">
    <input id="url" type="text" placeholder="예) https://www.youtube.com/watch?v=...">
    <button id="go">단축 URL + QR 만들기</button>
    <div class="msg" id="msg"></div>

    <div id="result">
      <div class="row">
        <div class="panel">
          <h3>🔗 단축 URL</h3>
          <a id="short" href="#" target="_blank"></a>
          <div class="small">원본: <span id="orig"></span></div>
          <div class="btns"><button id="copy">복사하기</button></div>
        </div>
        <div class="panel">
          <h3>🔳 QR코드 (단축 URL)</h3>
          <div id="qr"></div>
          <div class="btns"><button id="down">QR 다운로드</button></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 5주차 URL2QR과 연결 -->
  <a class="link2qr" href="../url2qr/">🔳 5주차 <b>URL2QR</b> 사이트로 이동 →</a>
</div>
<script>
  const $=id=>document.getElementById(id);
  function normalize(v){
    v=v.trim(); if(!v) return null;
    if(!/^https?:\/\//i.test(v)) v='https://'+v;
    try{ new URL(v); return v; }catch(e){ return null; }
  }
  // is.gd / v.gd 무료 단축 API (JSONP 방식이라 GitHub Pages에서도 동작)
  function shorten(host,url){
    return new Promise((ok,fail)=>{
      const cb='cb'+Date.now()+Math.floor(Math.random()*1000);
      const s=document.createElement('script');
      const t=setTimeout(()=>{cleanup();fail('timeout');},8000);
      function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
      window[cb]=d=>{cleanup(); d&&d.shorturl?ok(d.shorturl):fail(d&&d.errormessage||'error');};
      s.src=`https://${host}/create.php?format=json&callback=${cb}&url=${encodeURIComponent(url)}`;
      s.onerror=()=>{cleanup();fail('network');};
      document.body.appendChild(s);
    });
  }
  async function run(){
    const url=normalize($('url').value);
    $('msg').textContent='';
    if(!url){ $('msg').textContent='올바른 URL을 입력해 주세요.'; return; }
    $('go').disabled=true; $('go').textContent='만드는 중...';
    let short;
    try{ short=await shorten('is.gd',url); }
    catch(e){ try{ short=await shorten('v.gd',url); }catch(e2){ short=null; } }
    $('go').disabled=false; $('go').textContent='단축 URL + QR 만들기';
    if(!short){ $('msg').textContent='단축 URL 생성에 실패했습니다. 잠시 후 다시 시도해 주세요.'; return; }
    $('short').textContent=short; $('short').href=short;
    $('orig').textContent=url;
    $('qr').innerHTML='';
    new QRCode($('qr'),{text:short,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});
    $('result').style.display='block';
  }
  $('go').onclick=run;
  $('url').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
  $('copy').onclick=()=>{ navigator.clipboard.writeText($('short').textContent); $('copy').textContent='복사됨 ✓'; setTimeout(()=>$('copy').textContent='복사하기',1500); };
  $('down').onclick=()=>{
    const c=$('qr').querySelector('canvas');
    const a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='qrnshort.png'; a.click();
  };
</script>
</body>
</html>
