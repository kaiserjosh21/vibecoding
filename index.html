<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김형수의 시작 홈페이지</title>
<style>
  :root{--bg1:#0f172a;--bg2:#1e3a8a;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.15);--txt:#f1f5f9;--sub:#94a3b8;--accent:#38bdf8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--txt);min-height:100vh;padding:40px 16px}
  .wrap{max-width:860px;margin:0 auto}
  header{text-align:center;margin-bottom:32px}
  #clock{font-size:56px;font-weight:800;letter-spacing:2px}
  #date{color:var(--sub);margin-top:4px}
  h1{font-size:26px;margin-top:20px}
  .intro{color:var(--sub);margin-top:8px;line-height:1.6}
  form.search{display:flex;gap:8px;margin:28px 0}
  form.search input{flex:1;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;outline:none}
  form.search input:focus{border-color:var(--accent)}
  form.search button{padding:0 22px;border:0;border-radius:14px;background:var(--accent);color:#0f172a;font-weight:700;font-size:15px;cursor:pointer}
  h2{font-size:17px;margin:28px 0 12px;color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  a.card{display:block;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;transition:.2s}
  a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .ico{font-size:28px}
  .card .t{font-weight:700;margin-top:8px}
  .card .d{color:var(--sub);font-size:13px;margin-top:4px}
  footer{text-align:center;color:var(--sub);font-size:13px;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div id="clock">00:00:00</div>
    <div id="date"></div>
    <!-- ▼ 이름/소개 문구를 원하시는 대로 수정하세요 -->
    <h1>김형수의 시작 홈페이지</h1>
    <p class="intro">바이브코딩 수업에서 만든 나만의 시작 페이지입니다.<br>AI와 함께 만들고, GitHub Pages로 배포했습니다.</p>
  </header>

  <form class="search" action="https://www.google.com/search" method="get" target="_blank">
    <input type="text" name="q" placeholder="Google 검색어를 입력하세요" required>
    <button type="submit">검색</button>
  </form>

  <h2>🚀 바이브코딩 프로젝트</h2>
  <div class="grid">
    <a class="card" href="./url2qr/"><div class="ico">🔳</div><div class="t">URL2QR</div><div class="d">URL을 QR코드로 변환 (5주차)</div></a>
    <a class="card" href="./qrnshort/"><div class="ico">✂️</div><div class="t">QRnShort</div><div class="d">단축 URL + QR코드 생성 (6주차)</div></a>
  </div>

  <h2>⭐ 자주 가는 사이트</h2>
  <div class="grid">
    <a class="card" href="https://www.naver.com" target="_blank"><div class="ico">🟢</div><div class="t">네이버</div></a>
    <a class="card" href="https://www.youtube.com" target="_blank"><div class="ico">▶️</div><div class="t">유튜브</div></a>
    <a class="card" href="https://github.com" target="_blank"><div class="ico">🐙</div><div class="t">GitHub</div></a>
    <a class="card" href="https://claude.ai" target="_blank"><div class="ico">🤖</div><div class="t">Claude</div></a>
  </div>

  <footer>© 2026 바이브코딩 · Deployed on GitHub Pages</footer>
</div>
<script>
  const days=['일','월','화','수','목','금','토'];
  function tick(){
    const n=new Date();
    const p=v=>String(v).padStart(2,'0');
    document.getElementById('clock').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
    document.getElementById('date').textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 (${days[n.getDay()]})`;
  }
  tick(); setInterval(tick,1000);
</script>
</body>
</html>
