<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL2QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg1:#0f172a;--bg2:#065f46;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.15);--txt:#f1f5f9;--sub:#94a3b8;--accent:#34d399;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--txt);min-height:100vh;padding:40px 16px}
  .wrap{max-width:560px;margin:0 auto}
  nav{display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
  nav a{color:var(--txt);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px}
  nav a.on{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700}
  h1{text-align:center;font-size:34px}
  .sub{text-align:center;color:var(--sub);margin:8px 0 28px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
  input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font-size:16px;outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#0f172a;font-size:16px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}
  #result{display:none;text-align:center;margin-top:24px}
  #qr{display:inline-block;padding:14px;background:#fff;border-radius:14px}
  #qr img,#qr canvas{display:block}
  .url{word-break:break-all;color:var(--sub);font-size:14px;margin-top:12px}
  .msg{color:#fca5a5;font-size:14px;margin-top:10px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="../">🏠 홈</a>
    <a href="./" class="on">🔳 URL2QR</a>
    <a href="../qrnshort/">✂️ QRnShort</a>
  </nav>
  <h1>🔳 URL2QR</h1>
  <p class="sub">URL을 입력하면 QR코드로 바꿔 드립니다.</p>

  <div class="box">
    <input id="url" type="text" placeholder="예) https://www.naver.com">
    <button id="go">QR코드 만들기</button>
    <div class="msg" id="msg"></div>
    <div id="result">
      <div id="qr"></div>
      <div class="url" id="shown"></div>
      <button class="ghost" id="down">QR 이미지 다운로드</button>
    </div>
  </div>
</div>
<script>
  const $=id=>document.getElementById(id);
  function normalize(v){
    v=v.trim(); if(!v) return null;
    if(!/^https?:\/\//i.test(v)) v='https://'+v;
    try{ new URL(v); return v; }catch(e){ return null; }
  }
  function make(){
    const url=normalize($('url').value);
    $('msg').textContent='';
    if(!url){ $('msg').textContent='올바른 URL을 입력해 주세요.'; return; }
    $('qr').innerHTML='';
    new QRCode($('qr'),{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
    $('shown').textContent=url;
    $('result').style.display='block';
  }
  $('go').onclick=make;
  $('url').addEventListener('keydown',e=>{ if(e.key==='Enter') make(); });
  $('down').onclick=()=>{
    const c=$('qr').querySelector('canvas');
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png'); a.download='qrcode.png'; a.click();
  };
</script>
</body>
</html>
